name: CI Check

# 触发条件：对 main/master 分支发起 PR 或提交代码时触发
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    name: Code Verification
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 统一安装 pnpm (锁定 v9/v10 社区稳定大版本，避免使用 latest 造成非预期破坏)
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # 3. 配置 Node.js 环境并开启 pnpm 依赖缓存 (大幅提升构建速度)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # 4. 严格依赖锁定安装
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 5. 代码规范校验（利用前面配置的 @antfu/eslint-config）
      - name: Lint check
        run: pnpm run lint
        continue-on-error: true

      # 6. TypeScript 类型检查
      - name: Type check
        run: pnpm run typecheck
        continue-on-error: true

      # 7. 预编译测试 (确认 VitePress 能够正常产出静态文件，不丢报错)
      - name: Test Build
        run: pnpm run build