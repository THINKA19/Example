name: Docker CI/CD Deploy

# 仅当代码推送/合并到 master 分支时触发自动化部署
on:
  push:
    branches: [master]

jobs:
  build-and-deploy:
    name: Build Docker Image and Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取主干最新代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 登录 Docker 镜像仓库（如 Docker Hub 或 阿里云 ACR）
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. 初始化 Docker Buildx（开启高效构建与缓存支持）
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. 编译并推送 Docker 镜像 (指定前面设计的 docker/Dockerfile 路径)
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/vitepress-docs:latest
            ${{ secrets.DOCKER_USERNAME }}/vitepress-docs:${{ github.sha }}

      # 5. 通过 SSH 免密登录云服务器，使用 docker-compose 一键拉取与部署
      - name: Deploy to Remote Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # 登录 Docker 镜像仓库
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            # 拉取最新版本的镜像
            docker pull ${{ secrets.DOCKER_USERNAME }}/vitepress-docs:latest

            # 停止并清理旧容器
            docker stop vitepress-docs-container || true
            docker rm vitepress-docs-container || true

            # 启动新容器（映射宿主机 8080 端口到容器内 80 端口）
            docker run -d \
              --name vitepress-docs-container \
              --restart always \
              -p 8080:80 \
              ${{ secrets.DOCKER_USERNAME }}/vitepress-docs:latest

            # 清理废弃的无用镜像，释放服务器磁盘
            docker image prune -f
