packages:
  - "apps/*"
  - "packages/*"
  - "tools/*"

# Single source of truth for external dependency versions.
# Projects reference them with "catalog:". Exact versions are pinned by pnpm-lock.yaml.
#
# Deliberately NOT listed here: eslint-plugin-vue, eslint-plugin-react,
# eslint-plugin-react-hooks and similar framework lint plugins. @antfu/eslint-config
# pulls these in itself when { vue: true } / { react: true } is passed — pinning
# them separately here risks fighting the versions it resolves internally.
catalog:
  "@antfu/eslint-config": ^3.0.0
  "@commitlint/cli": ^19.6.0
  "@commitlint/config-conventional": ^19.6.0
  "@types/node": ^22.0.0
  eslint: ^9.20.0
  husky: ^9.1.0
  lint-staged: ^15.4.0
  tsx: ^4.19.0
  turbo: ^2.5.0
  typescript: ^5.8.0
  vitest: ^3.0.0
