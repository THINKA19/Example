server {
    # 浏览器访问 http://xxx 就是 80 端口
    listen 80;
    # 本机访问域名，后续部署到服务器上这里可以改成你的域名，比如 `docs.abc.com`
    server_name localhost;

    # 网站文件放在这个目录。对应你 Dockerfile 里复制 dist 的路径，VitePress 打包出来的静态文件全部丢这里
    root /usr/share/nginx/html;
    # 访问文件夹时，默认打开 index.html
    index index.html;

    # ==================== 1. 基础安全防护响应头 ====================
    # 隐藏 Nginx 具体版本号，防止暴露特定版本的安全漏洞
    server_tokens off;
    # 开启防 MIME 类型嗅探保护
    add_header X-Content-Type-Options "nosniff" always;
    # 防止网页被嵌套在其他站点的 iframe 中 (防点击劫持)
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ==================== 2. VitePress 路由与 HTML 处理 ====================
    location / {
        # 适配 VitePress cleanUrls 路由：依次查找 真实文件 -> 对应.html文件 -> 目录 -> 回退index.html
        try_files $uri $uri.html $uri/ /index.html;

        # 核心防坑：HTML 网页必须使用协商缓存（no-cache），确保用户每次刷新都能获取到最新生成的 HTML 页面
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 自定义 404 页面兜底（可配合 VitePress 编译生成的 404.html）
    error_page 404 /404.html;

    # ==================== 3. 静态资源强缓存 (带 Hash 值的打包产物) ====================
    # 仅针对静态资源（JS/CSS/图片/字体）设置长达 1 年的强缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        
        # 关闭静态资源日志输出，减少磁盘 I/O 开销
        access_log off;
        log_not_found off;
    }

    # ==================== 4. 文本压缩支持 (Gzip) ====================
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_vary on;
    # 开启静态预压缩文件读取（若构建产物中已包含 .gz 文件，直接返回，免去 Nginx 实时 CPU 计算）
    gzip_static on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;
}