name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: template

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: template/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: template/.nvmrc
          cache: pnpm
          cache-dependency-path: template/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm build